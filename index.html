<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Contact Manager</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">

  <div class="card login-card">
    <h1>Welcome back 👋</h1>
    <p class="hint">
      Demo login → <b>admin@test.com</b> / <b>Admin@123</b>
    </p>

    <!-- novalidate turns OFF the browser's built-in popups so OUR JavaScript validation runs -->
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="username" />
        <p class="error" id="emailError"></p>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" />
          <button type="button" id="togglePassword">Show</button>
        </div>
        <p class="error" id="passwordError"></p>
      </div>

      <div class="form-group">
        <label style="font-weight: normal">
          <input type="checkbox" id="rememberMe" style="width: auto" /> Remember my email
        </label>
      </div>

      <button type="submit" class="btn full" id="loginBtn">Login</button>
      <p class="form-message" id="formMessage"></p>
    </form>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
